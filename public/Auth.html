<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arka - Login & Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a3d 0%, #2a4066 100%);
      color: white;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.6);
    }
    .navbar-brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00aaff !important;
    }
    .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      color: #00aaff !important;
    }
    .auth-container {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      margin-top: 2rem;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      box-shadow: none;
      border-color: #00aaff;
    }
    .btn-primary {
      background: #00aaff;
      border: none;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover {
      transform: scale(1.05);
      background: #0088cc;
    }
    .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.5);
    }
    .error-message {
      display: none;
      color: #ff6b6b;
      font-size: 0.9rem;
    }
    @media (max-width: 576px) {
      .auth-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      .navbar-brand {
        font-size: 1.5rem;
      }
      .nav-link {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" id="authLink" href="/Auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <h2 class="text-center mb-4">Login / Signup</h2>
    <!-- Login Form -->
    <div id="loginForm">
      <h4 class="mb-3">Login</h4>
      <div class="mb-3">
        <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="error-message mb-3" id="loginError"></div>
      <button class="btn btn-primary w-100 mb-3" id="loginButton">Login</button>
      <button class="btn btn-outline-light w-100 mb-3" id="googleLoginButton">
        <i class="fab fa-google me-2"></i> Sign in with Google
      </button>
      <p class="text-center">
        Don't have an account? <a href="#" id="showSignup">Sign Up</a>
      </p>
    </div>
    <!-- Signup Form -->
    <div id="signupForm" style="display: none;">
      <h4 class="mb-3">Sign Up</h4>
      <div class="mb-3">
        <input type="text" class="form-control" id="signupName" placeholder="Full Name" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" id="signupEmail" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="tel" class="form-control" id="signupPhone" placeholder="Phone Number" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="signupPassword" placeholder="Password" required>
      </div>
      <div class="error-message mb-3" id="signupError"></div>
      <button class="btn btn-primary w-100 mb-3" id="signupButton">Sign Up</button>
      <button class="btn btn-outline-light w-100 mb-3" id="googleSignupButton">
        <i class="fab fa-google me-2"></i> Sign up with Google
      </button>
      <p class="text-center">
        Already have an account? <a href="#" id="showLogin">Login</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { loginWithEmail, signupWithEmail, signInWithGoogle, handleGoogleRedirectResult, onAuthStateChange, signOutUser } from '/assets/js/services/auth.js';

    // Show loading state
    function showLoading(button) {
      button.disabled = true;
      button.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...';
    }

    // Hide loading state
    function hideLoading(button, originalText) {
      button.disabled = false;
      button.innerHTML = originalText;
    }

    // Validate email format
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    // Login function
    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorElement = document.getElementById('loginError');
      const loginButton = document.getElementById('loginButton');
      const originalText = loginButton.innerHTML;

      errorElement.style.display = 'none';
      if (!isValidEmail(email)) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Please enter a valid email address.';
        return;
      }
      if (!password) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Please enter a password.';
        return;
      }

      showLoading(loginButton);
      try {
        await loginWithEmail(email, password);
        await new Promise(resolve => {
          onAuthStateChange(user => {
            if (user) resolve();
          });
        });
        window.location.href = '/pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      } finally {
        hideLoading(loginButton, originalText);
      }
    }

    // Signup function
    async function signup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const phone = document.getElementById('signupPhone').value;
      const password = document.getElementById('signupPassword').value;
      const errorElement = document.getElementById('signupError');
      const signupButton = document.getElementById('signupButton');
      const originalText = signupButton.innerHTML;

      errorElement.style.display = 'none';
      if (!name) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Please enter your full name.';
        return;
      }
      if (!isValidEmail(email)) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Please enter a valid email address.';
        return;
      }
      if (!phone) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Please enter your phone number.';
        return;
      }
      if (password.length < 6) {
        errorElement.style.display = 'block';
        errorElement.textContent = 'Password must be at least 6 characters long.';
        return;
      }

      showLoading(signupButton);
      try {
        await signupWithEmail(name, email, phone, password);
        await new Promise(resolve => {
          onAuthStateChange(user => {
            if (user) resolve();
          });
        });
        window.location.href = '/pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      } finally {
        hideLoading(signupButton, originalText);
      }
    }

    // Google Sign-in/Sign-up
    async function handleGoogleAuth(errorElementId, buttonId) {
      const errorElement = document.getElementById(errorElementId);
      const button = document.getElementById(buttonId);
      const originalText = button.innerHTML;

      errorElement.style.display = 'none';
      showLoading(button);
      try {
        await signInWithGoogle();
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
        hideLoading(button, originalText);
      }
    }

    // Handle Google redirect result
    async function checkGoogleRedirect() {
      try {
        const user = await handleGoogleRedirectResult();
        if (user) {
          await new Promise(resolve => {
            onAuthStateChange(user => {
              if (user) resolve();
            });
          });
          window.location.href = '/pages/profile.html';
        }
      } catch (error) {
        const errorElement = document.getElementById('signupError') || document.getElementById('loginError');
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      }
    }

    // Update navbar
    const authLink = document.getElementById('authLink');
    authLink.textContent = 'Loading...';
    onAuthStateChange((user) => {
      console.log('Auth state changed in Auth.html:', user ? 'Logged in' : 'Logged out', user);
      if (user) {
        authLink.textContent = 'Signout';
        authLink.href = '#';
        authLink.onclick = async () => {
          try {
            await signOutUser();
            console.log('User signed out');
            window.location.href = '/index.html';
          } catch (error) {
            console.error('Logout failed:', error);
          }
        };
      } else {
        authLink.textContent = 'Login';
        authLink.href = '/Auth.html';
        authLink.onclick = null;
      }
    });

    // Toggle forms
    document.getElementById('showSignup').addEventListener('click', () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    });

    document.getElementById('showLogin').addEventListener('click', () => {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
    });

    // Event listeners
    document.getElementById('loginButton').addEventListener('click', login);
    document.getElementById('signupButton').addEventListener('click', signup);
    document.getElementById('googleLoginButton').addEventListener('click', () => handleGoogleAuth('loginError', 'googleLoginButton'));
    document.getElementById('googleSignupButton').addEventListener('click', () => handleGoogleAuth('signupError', 'googleSignupButton'));

    window.addEventListener('load', checkGoogleRedirect);
  </script>
</body>
</html>
