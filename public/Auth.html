<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arka - Authentication</title>
  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <!-- Custom CSS -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #1a3c34 0%, #d97706 100%);
      color: white;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      padding: 0.5rem 1rem;
    }
    .navbar-brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #f59e0b !important;
      text-transform: uppercase;
    }
    .nav-link {
      color: white !important;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: #f59e0b !important;
    }
    .navbar-nav {
      gap: 0.5rem;
    }
    .navbar-collapse {
      justify-content: flex-end;
    }
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .auth-card {
      background: rgba(0, 0, 0, 0.6);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
    }
    .auth-card h2 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      color: #f59e0b;
      margin-bottom: 1.5rem;
    }
    .nav-tabs .nav-link {
      color: white !important;
      background: rgba(255, 255, 255, 0.1);
      border: none;
    }
    .nav-tabs .nav-link.active {
      color: #f59e0b !important;
      background: rgba(0, 0, 0, 0.8);
    }
    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      margin-bottom: 1rem;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      box-shadow: none;
      border-color: #f59e0b;
    }
    .btn-primary {
      background: #f59e0b;
      border: none;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }
    .btn-google {
      background: #ffffff;
      color: #333;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }
    .btn-google img {
      width: 20px;
      margin-right: 10px;
    }
    .btn-google:hover {
      background: #f1f1f1;
      transform: scale(1.05);
    }
    .error-message {
      color: #b91c1c;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }
    @media (max-width: 768px) {
      .navbar-brand { font-size: 1.5rem; }
      .nav-link { font-size: 0.9rem; padding: 0.5rem; }
      .navbar-nav { text-align: center; }
      .auth-card { padding: 1.5rem; }
      .auth-card h2 { font-size: 1.5rem; }
    }
    @media (max-width: 576px) {
      .navbar { padding: 0.5rem; }
      .navbar-brand { font-size: 1.3rem; }
      .nav-link { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link active" id="authLink" href="/Auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Authentication Section -->
  <div class="auth-container">
    <div class="auth-card animate__animated animate__fadeIn">
      <h2>Arka Authentication</h2>
      <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" id="login-tab" data-bs-toggle="tab" href="#login" role="tab">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="signup-tab" data-bs-toggle="tab" href="#signup" role="tab">Sign Up</a>
        </li>
      </ul>
      <div class="tab-content">
        <!-- Login Tab -->
        <div class="tab-pane fade show active" id="login" role="tabpanel">
          <div class="mb-3">
            <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
          </div>
          <button class="btn btn-primary w-100 mb-3" id="loginButton">Login</button>
          <button class="btn btn-google w-100" id="googleLoginButton">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            Sign in with Google
          </button>
          <p class="error-message" id="loginError"></p>
        </div>
        <!-- Signup Tab -->
        <div class="tab-pane fade" id="signup" role="tabpanel">
          <div class="mb-3">
            <input type="text" class="form-control" id="signupName" placeholder="Full Name" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="signupEmail" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" id="signupPhone" placeholder="Phone Number" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="signupPassword" placeholder="Password" required>
          </div>
          <button class="btn btn-primary w-100 mb-3" id="signupButton">Sign Up</button>
          <button class="btn btn-google w-100" id="googleSignupButton">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            Sign up with Google
          </button>
          <p class="error-message" id="signupError"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/assets/js/services/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { loginWithEmail, signupWithEmail, signInWithGoogle, onAuthStateChange, signOutUser } from '/assets/js/services/auth.js';

    // Login function
    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorElement = document.getElementById('loginError');
      try {
        await loginWithEmail(email, password);
        window.location.href = './pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      }
    }

    // Signup function
    async function signup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const phone = document.getElementById('signupPhone').value;
      const password = document.getElementById('signupPassword').value;
      const errorElement = document.getElementById('signupError');
      try {
        await signupWithEmail(name, email, phone, password);
        window.location.href = './pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      }
    }

    // Attach event listeners
    document.getElementById('loginButton').addEventListener('click', login);
    document.getElementById('signupButton').addEventListener('click', signup);
    document.getElementById('googleLoginButton').addEventListener('click', async () => {
      const errorElement = document.getElementById('loginError');
      try {
        await signInWithGoogle();
        window.location.href = '/pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      }
    });
    document.getElementById('googleSignupButton').addEventListener('click', async () => {
      const errorElement = document.getElementById('signupError');
      try {
        await signInWithGoogle();
        window.location.href = '/pages/profile.html';
      } catch (error) {
        errorElement.style.display = 'block';
        errorElement.textContent = error.message;
      }
    });

    // Update navbar based on auth state
    onAuthStateChange((user) => {
      const authLink = document.getElementById('authLink');
      if (user) {
        authLink.textContent = 'Logout';
        authLink.href = '#';
        authLink.onclick = async () => {
          try {
            await signOutUser();
            window.location.href = '/index.html';
          } catch (error) {
            console.error('Logout failed:', error);
          }
        };
      } else {
        authLink.textContent = 'Login';
        authLink.href = '/Auth.html';
        authLink.onclick = null;
      }
    });
  </script>
</body>
</html>
