<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arka - Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #1a3c34 0%, #d97706 100%);
      color: white;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      padding: 0.5rem 1rem;
    }
    .navbar-brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #f59e0b !important;
      text-transform: uppercase;
    }
    .nav-link {
      color: white !important;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: #f59e0b !important;
    }
    .navbar-nav {
      gap: 0.5rem;
    }
    .navbar-collapse {
      justify-content: flex-end;
    }
    .container {
      padding-top: 5rem;
      padding-bottom: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background: #f59e0b;
      border: none;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }
    .btn-outline-light {
      border-color: #f59e0b;
      color: #f59e0b;
      transition: transform 0.3s ease;
    }
    .btn-outline-light:hover {
      background: #f59e0b;
      color: white;
      transform: scale(1.05);
    }
    h1 {
      font-size: 2.5rem;
      color: #f59e0b;
      text-align: center;
      margin-bottom: 2rem;
    }
    h5 {
      color: #b91c1c;
      font-size: 1.5rem;
    }
    @media (max-width: 768px) {
      .navbar-brand { font-size: 1.5rem; }
      .nav-link { font-size: 0.9rem; padding: 0.5rem; }
      .navbar-nav { text-align: center; }
      h1 { font-size: 2rem; }
      .card { padding: 1rem; }
      .container { padding-top: 4rem; }
    }
    @media (max-width: 576px) {
      .navbar { padding: 0.5rem; }
      .navbar-brand { font-size: 1.3rem; }
      .nav-link { font-size: 0.8rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" id="authLink" href="/Auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Cultural Events</h1>
    <div class="row" id="events-container">
      <!-- Dynamic cultural event cards will be inserted here -->
    </div>

    <h1 class="text-center my-4">Shopping Events</h1>
    <div class="row" id="shopping-container">
      <!-- Dynamic shopping event cards will be inserted here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { onAuthStateChange, signOutUser } from '/assets/js/services/auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDkYJtwm9mqrq2zFIIr0DXElYG44WIpswI",
      authDomain: "arka-5258.firebaseapp.com",
      databaseURL: "https://arka-5258-default-rtdb.firebaseio.com",
      projectId: "arka-5258",
      storageBucket: "arka-5258.firebasestorage.app",
      messagingSenderId: "378365125891",
      appId: "1:378365125891:web:43e9ca1df58152d9f8b536",
      measurementId: "G-2V7TSEBWQ8"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const firestore = getFirestore(app);

    let currentUser = null;

    // Handle authentication state changes for login/logout
    const authLink = document.getElementById('authLink');
    authLink.textContent = 'Loading...';
    onAuthStateChange((user) => {
      console.log('Auth state changed:', user ? 'Logged in' : 'Logged out', user);
      currentUser = user;
      if (user) {
        authLink.textContent = 'Signout';
        authLink.href = '#';
        authLink.onclick = async () => {
          try {
            await signOutUser();
            console.log('User signed out');
            window.location.href = '/index.html';
          } catch (error) {
            console.error('Logout failed:', error);
          }
        };
      } else {
        authLink.textContent = 'Login';
        authLink.href = '/Auth.html';
        authLink.onclick = null;
      }
      renderEvents(); // Re-render to update "Book Event" button visibility
    });

    // Save event booking to user's profile
    async function bookEvent(eventId, event, type) {
      if (!currentUser) {
        alert('Please log in to book events.');
        window.location.href = '/Auth.html';
        return;
      }
      try {
        const userDocRef = doc(firestore, 'users', currentUser.uid);
        await setDoc(userDocRef, {
          event_bookings: {
            [eventId]: {
              name: event.name,
              date: event.date,
              time: event.time,
              location: event.location,
              ticket_price: event.ticket_price,
              type: type // 'cultural' or 'shopping'
            }
          }
        }, { merge: true });
        alert(`${event.name} has been booked and saved to your profile!`);
      } catch (error) {
        console.error('Error booking event:', error);
        alert('Failed to book the event. Please try again.');
      }
    }

    // Render events
    function renderEvents() {
      const eventsContainer = document.getElementById('events-container');
      const shoppingContainer = document.getElementById('shopping-container');
      eventsContainer.innerHTML = '';
      shoppingContainer.innerHTML = '';

      // Render cultural events
      const eventsRef = ref(database, 'events');
      onValue(eventsRef, (snapshot) => {
        const events = snapshot.val() || {};
        const eventList = Object.entries(events).map(([eventId, event]) => ({ eventId, ...event }));

        if (eventList.length === 0) {
          eventsContainer.innerHTML = '<p class="text-center">No cultural events found.</p>';
        } else {
          eventList.forEach(event => {
            const colDiv = document.createElement('div');
            colDiv.className = 'col-md-4 mb-4';

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card text-white h-100 d-flex flex-column';

            const cardBody = document.createElement('div');
            cardBody.className = 'p-3 flex-grow-1 d-flex flex-column';

            const title = document.createElement('h5');
            title.textContent = event.name;
            cardBody.appendChild(title);

            const dateTime = document.createElement('p');
            dateTime.textContent = `Date: ${event.date} | Time: ${event.time}`;
            cardBody.appendChild(dateTime);

            const location = document.createElement('p');
            location.textContent = `Location: ${event.location}`;
            cardBody.appendChild(location);

            const ticketPrice = document.createElement('p');
            ticketPrice.textContent = `Ticket Price: ${event.ticket_price}`;
            cardBody.appendChild(ticketPrice);

            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'mt-auto d-flex gap-2';

            if (currentUser) {
              const bookButton = document.createElement('button');
              bookButton.className = 'btn btn-primary flex-grow-1';
              bookButton.textContent = event.ticket_price.toLowerCase() === 'free' ? 'Join Event' : 'Book Event Pass';
              bookButton.onclick = () => bookEvent(event.eventId, event, 'cultural');
              buttonGroup.appendChild(bookButton);
            }

            cardBody.appendChild(buttonGroup);
            cardDiv.appendChild(cardBody);
            colDiv.appendChild(cardDiv);
            eventsContainer.appendChild(colDiv);
          });
        }
      }, (error) => {
        console.error('Error fetching cultural events:', error);
        eventsContainer.innerHTML = '<p class="text-center text-danger">Error loading cultural events. Please try again later.</p>';
      });

      // Render shopping events
      const shoppingRef = ref(database, 'shopping_events');
      onValue(shoppingRef, (snapshot) => {
        const shoppingEvents = snapshot.val() || {};
        const shoppingList = Object.entries(shoppingEvents).map(([eventId, event]) => ({ eventId, ...event }));

        if (shoppingList.length === 0) {
          shoppingContainer.innerHTML = '<p class="text-center">No shopping events found.</p>';
        } else {
          shoppingList.forEach(event => {
            const colDiv = document.createElement('div');
            colDiv.className = 'col-md-4 mb-4';

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card text-white h-100 d-flex flex-column';

            const cardBody = document.createElement('div');
            cardBody.className = 'p-3 flex-grow-1 d-flex flex-column';

            const title = document.createElement('h5');
            title.textContent = event.name;
            cardBody.appendChild(title);

            const dateTime = document.createElement('p');
            dateTime.textContent = `Date: ${event.date} | Time: ${event.time}`;
            cardBody.appendChild(dateTime);

            const location = document.createElement('p');
            location.textContent = `Location: ${event.location}`;
            cardBody.appendChild(location);

            const ticketPrice = document.createElement('p');
            ticketPrice.textContent = `Ticket Price: ${event.ticket_price}`;
            cardBody.appendChild(ticketPrice);

            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'mt-auto d-flex gap-2';

            if (currentUser) {
              const bookButton = document.createElement('button');
              bookButton.className = 'btn btn-outline-light flex-grow-1';
              bookButton.textContent = event.button_text || (event.ticket_price.toLowerCase() === 'free' ? 'Join Event' : 'Book Event Pass');
              bookButton.onclick = () => bookEvent(event.eventId, event, 'shopping');
              buttonGroup.appendChild(bookButton);
            }

            cardBody.appendChild(buttonGroup);
            cardDiv.appendChild(cardBody);
            colDiv.appendChild(cardDiv);
            shoppingContainer.appendChild(colDiv);
          });
        }
      }, (error) => {
        console.error('Error fetching shopping events:', error);
        shoppingContainer.innerHTML = '<p class="text-center text-danger">Error loading shopping events. Please try again later.</p>';
      });
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', () => {
      renderEvents();
    });
  </script>
</body>
</html>
