<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arka - Road-Accurate Bus Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #1a1a3d; color: white; font-family: 'Arial', sans-serif; }
    .map-container { height: 500px; border-radius: 10px; overflow: hidden; position: relative; }
    #map { height: 100%; }
    .navbar { background: rgba(0, 0, 0, 0.6); }
    .navbar-brand { font-size: 1.8rem; font-weight: bold; color: #00aaff !important; }
    .nav-link { color: white !important; }
    .nav-link:hover { color: #00aaff !important; }
    .card { background: rgba(255, 255, 255, 0.1); border: none; }
    .btn { transition: transform 0.3s ease; }
    .btn:hover { transform: scale(1.05); }
    .leaflet-control-attribution { background: rgba(0,0,0,0.7) !important; color: white; }
    .bus-info-window { color: black; min-width: 250px; }
    .status-on-route { color: #28a745; }
    .status-departing-soon { color: #ffc107; }
    .status-arrived { color: #17a2b8; }
    .status-at-depot { color: #6c757d; }
    .legend { background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
    .legend i { width: 18px; height: 18px; display: inline-block; margin-right: 5px; }
    .route-controls { position: absolute; top: 10px; right: 10px; z-index: 1000; }
    .loading-spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; }
    @media (max-width: 768px) {
      .navbar-brand { font-size: 1.5rem; }
      .nav-link { font-size: 0.9rem; }
      .map-container { height: 400px; }
    }
    @media (max-width: 576px) {
      .navbar-brand { font-size: 1.3rem; }
      .nav-link { font-size: 0.8rem; }
      .map-container { height: 300px; }
    }
  </style>
</head>
<body>
  <!-- Loading Spinner -->
  <div id="loading-spinner" class="loading-spinner text-white">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" id="authLink" href="/Auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Real-Time Bus Tracking</h1>
    <div class="map-container mb-4 position-relative">
      <div id="map"></div>
      <div class="route-controls">
        <button id="show-routes" class="btn btn-sm btn-primary mb-2">Show All Routes</button>
        <button id="hide-routes" class="btn btn-sm btn-secondary">Hide Routes</button>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card text-white p-3">
          <h4 class="mb-3">Active Buses</h4>
          <div id="bus-list" class="row">
            <p id="no-buses-message" style="display: none;">No active buses available at the moment.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
    import { onAuthStateChange, signOutUser } from '/assets/js/services/auth.js';
    import { subscribeToBusLocation } from '/assets/js/services/realtime.js';

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDkYJtwm9mqrq2zFIIr0DXElYG44WIpswI",
      authDomain: "arka-5258.firebaseapp.com",
      databaseURL: "https://arka-5258-default-rtdb.firebaseio.com",
      projectId: "arka-5258",
      storageBucket: "arka-5258.firebasestorage.app",
      messagingSenderId: "378365125891",
      appId: "1:378365125891:web:43e9ca1df58152d9f8b536",
      measurementId: "G-2V7TSEBWQ8"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    console.log('Firebase and Realtime Database initialized:', app, database);

    // Initialize the map centered on Odisha, India
    const map = L.map('map').setView([20.9517, 85.0985], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Status color mapping
    const statusColors = {
      "On Route": "#28a745",
      "Departing Soon": "#ffc107",
      "Arrived": "#17a2b8",
      "At Depot": "#6c757d"
    };

    // Arrays to store markers and routes
    const busMarkers = [];
    const routeControls = [];
    const busStopsMarkers = [];

    // Function to show loading spinner
    function showLoading() {
      document.getElementById('loading-spinner').style.display = 'block';
    }

    // Function to hide loading spinner
    function hideLoading() {
      document.getElementById('loading-spinner').style.display = 'none';
    }

    // Function to fetch bus and route data from Realtime Database
    function fetchDataFromRealtimeDatabase() {
      showLoading();
      return new Promise((resolve, reject) => {
        const busesRef = ref(database, 'buses');
        const routesRef = ref(database, 'routes');
        const data = { buses: {}, routes: {} };

        onValue(busesRef, (snapshot) => {
          data.buses = snapshot.val() || {};
          console.log('Buses fetched:', data.buses);

          onValue(routesRef, (snapshot) => {
            data.routes = snapshot.val() || {};
            console.log('Routes fetched:', data.routes);
            hideLoading();
            resolve(data);
          }, (error) => {
            console.error('Error fetching routes:', error);
            hideLoading();
            reject(error);
          });
        }, (error) => {
          console.error('Error fetching buses:', error);
          hideLoading();
          reject(error);
        });
      });
    }

    // Function to calculate road-based route
    async function calculateRoute(waypoints, bus) {
      showLoading();
      try {
        const control = L.Routing.control({
          waypoints,
          routeWhileDragging: false,
          show: false,
          addWaypoints: false,
          draggableWaypoints: false,
          fitSelectedRoutes: false,
          createMarker: () => null,
          lineOptions: {
            styles: [{ color: statusColors[bus.live_status] || '#6c757d', opacity: 0.8, weight: 5 }]
          },
          router: L.Routing.osrmv1({
            serviceUrl: 'https://router.project-osrm.org/route/v1'
          })
        }).addTo(map);
        routeControls.push(control);
      } catch (error) {
        console.error("Routing error for bus:", bus.route, error);
      } finally {
        hideLoading();
      }
    }

    // Function to process buses and add to map
    async function processBuses(data) {
      const busesArray = Object.values(data.buses);
      for (const bus of busesArray) {
        const busId = Object.keys(data.buses).find(id => data.buses[id] === bus);
        const routeId = Object.keys(data.routes).find(id =>
          data.routes[id].origin + " - " + data.routes[id].destination === bus.route
        );
        const routeDetails = routeId ? data.routes[routeId] : null;

        // Create bus marker
        const busMarker = L.marker([bus.current_location.lat, bus.current_location.lng], {
          icon: L.divIcon({
            className: 'bus-icon',
            html: `<div style="background: ${statusColors[bus.live_status] || '#6c757d'}; color: white; border: 2px solid white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold;"><i class="fas fa-bus"></i></div>`,
            iconSize: [24, 24]
          })
        }).addTo(map);

        const infoContent = `
          <div class="bus-info-window">
            <h5>${bus.route}</h5>
            <p><strong>Status:</strong> <span class="status-${bus.live_status.toLowerCase().replace(' ', '-') || 'unknown'}">${bus.live_status}</span></p>
            <p><strong>Seats:</strong> ${bus.seats_available}/${bus.total_seats} available</p>
            <p><strong>Driver:</strong> ${bus.driver_id}</p>
            <p><strong>Next Trip:</strong> ${bus.schedule[0].direction === 'A_to_B' ? (routeDetails ? routeDetails.destination : 'Unknown') : (routeDetails ? routeDetails.origin : 'Unknown')} at ${bus.schedule[0].departure}</p>
          </div>
        `;
        busMarker.bindPopup(infoContent);
        busMarkers.push(busMarker);

        // Create route waypoints
        if (routeDetails && routeDetails.stops && routeDetails.stops.length > 0) {
          const waypoints = [
            L.latLng(bus.current_location.lat, bus.current_location.lng),
            ...routeDetails.stops.map(stop => L.latLng(stop.geolocation.lat, stop.geolocation.lng))
          ];
          await calculateRoute(waypoints, bus);
        }

        // Create bus stop markers
        if (routeDetails && routeDetails.stops) {
          routeDetails.stops.forEach(stop => {
            const stopMarker = L.marker([stop.geolocation.lat, stop.geolocation.lng], {
              icon: L.divIcon({
                className: 'bus-stop-icon',
                html: '<div style="background: #6c757d; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-map-marker-alt"></i></div>',
                iconSize: [18, 18]
              })
            }).addTo(map).bindPopup(`<strong>${stop.name}</strong><br>${bus.route}`);
            busStopsMarkers.push(stopMarker);
          });
        }

        // Subscribe to real-time location updates
        subscribeToBusLocation(busId, (location) => {
          if (location) {
            console.log(`Updating location for bus ${busId}:`, location);
            busMarker.setLatLng([location.latitude, location.longitude]);
            if (routeDetails && routeDetails.stops) {
              const waypoints = [
                L.latLng(location.latitude, location.longitude),
                ...routeDetails.stops.map(stop => L.latLng(stop.geolocation.lat, stop.geolocation.lng))
              ];
              const control = routeControls.find(c => c.getPlan().getWaypoints()[0].latLng.equals(busMarker.getLatLng()));
              if (control) {
                control.setWaypoints(waypoints);
              }
            }
          }
        });
      }
    }

    // Function to update bus list
    function updateBusList(data) {
      const busListElement = document.getElementById('bus-list');
      const noBusesMessage = document.getElementById('no-buses-message');
      busListElement.innerHTML = '';
      const busesArray = Object.values(data.buses);

      if (busesArray.length === 0) {
        noBusesMessage.style.display = 'block';
        return;
      }

      noBusesMessage.style.display = 'none';
      busesArray.forEach(bus => {
        const routeId = Object.keys(data.routes).find(id =>
          data.routes[id].origin + " - " + data.routes[id].destination === bus.route
        );
        const routeDetails = routeId ? data.routes[routeId] : null;

        const busElement = document.createElement('div');
        busElement.className = 'col-md-6 mb-3';
        busElement.innerHTML = `
          <div class="card text-white p-3 h-100" style="border-left: 4px solid ${statusColors[bus.live_status] || '#6c757d'}">
            <h5>${bus.route}</h5>
            <p><strong>Status:</strong> <span class="status-${bus.live_status.toLowerCase().replace(' ', '-') || 'unknown'}">${bus.live_status}</span></p>
            <p><strong>Seats:</strong> ${bus.seats_available}/${bus.total_seats} available</p>
            <p><strong>Next Trip:</strong> ${bus.schedule[0].departure} to ${bus.schedule[0].direction === 'A_to_B' ? (routeDetails ? routeDetails.destination : 'Unknown') : (routeDetails ? routeDetails.origin : 'Unknown')}</p>
          </div>
        `;
        busListElement.appendChild(busElement);
      });
    }

    // Add legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <h6>Bus Status</h6>
        <div><i style="background:${statusColors["On Route"]}"></i> On Route</div>
        <div><i style="background:${statusColors["Departing Soon"]}"></i> Departing Soon</div>
        <div><i style="background:${statusColors["Arrived"]}"></i> Arrived</div>
        <div><i style="background:${statusColors["At Depot"]}"></i> At Depot</div>
        <div><i style="background:#6c757d"><i class="fas fa-map-marker-alt" style="color:white; font-size:10px"></i></i> Bus Stop</div>
      `;
      return div;
    };
    legend.addTo(map);

    // Route visibility controls
    document.getElementById('show-routes').addEventListener('click', () => {
      routeControls.forEach(control => {
        control.getPlan().setWaypoints(control.getPlan().getWaypoints());
        control._container.style.display = 'block';
      });
    });
    document.getElementById('hide-routes').addEventListener('click', () => {
      routeControls.forEach(control => {
        control._container.style.display = 'none';
      });
    });

    // Update navbar with auth state
    const authLink = document.getElementById('authLink');
    authLink.textContent = 'Loading...';
    onAuthStateChange((user) => {
      console.log('Auth state changed:', user ? 'Logged in' : 'Logged out', user);
      if (user) {
        authLink.textContent = 'Signout';
        authLink.href = '#';
        authLink.onclick = async () => {
          try {
            await signOutUser();
            console.log('User signed out');
            window.location.href = '/index.html';
          } catch (error) {
            console.error('Logout failed:', error);
          }
        };
      } else {
        authLink.textContent = 'Login';
        authLink.href = '/Auth.html';
        authLink.onclick = null;
      }
    });

    // Initialize the app
    async function init() {
      try {
        const data = await fetchDataFromRealtimeDatabase();
        console.log('Realtime Database data loaded:', data);
        updateBusList(data);
        await processBuses(data);
        if (busMarkers.length > 0) {
          const group = new L.featureGroup(busMarkers);
          map.fitBounds(group.getBounds().pad(0.2));
        }
      } catch (error) {
        console.error('Initialization error:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
