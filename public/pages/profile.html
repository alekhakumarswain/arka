<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arka - Profile</title>
  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <!-- Custom CSS -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #1a3c34 0%, #d97706 100%);
      color: white;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      padding: 0.5rem 1rem;
    }
    .navbar-brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #f59e0b !important;
      text-transform: uppercase;
    }
    .nav-link {
      color: white !important;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: #f59e0b !important;
    }
    .navbar-nav {
      gap: 0.5rem;
    }
    .navbar-collapse {
      justify-content: flex-end;
    }
    .container {
      padding-top: 5rem;
      padding-bottom: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background: #f59e0b;
      border: none;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }
    .btn-outline-light {
      border-color: #f59e0b;
      color: #f59e0b;
      transition: transform 0.3s ease;
    }
    .btn-outline-light:hover {
      background: #f59e0b;
      color: white;
      transform: scale(1.05);
    }
    h1 {
      font-size: 2.5rem;
      color: #f59e0b;
      text-align: center;
      margin-bottom: 2rem;
    }
    h5 {
      color: #b91c1c;
      font-size: 1.5rem;
    }
    .error-message {
      color: #b91c1c;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.5rem;
    }
    .modal-content {
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border-radius: 15px;
    }
    .modal-header, .modal-footer {
      border: none;
    }
    .modal-title {
      color: #f59e0b;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      box-shadow: none;
      border-color: #f59e0b;
    }
    @media (max-width: 768px) {
      .navbar-brand { font-size: 1.5rem; }
      .nav-link { font-size: 0.9rem; padding: 0.5rem; }
      .navbar-nav { text-align: center; }
      h1 { font-size: 2rem; }
      .card { padding: 1rem; }
      .container { padding-top: 4rem; }
    }
    @media (max-width: 576px) {
      .navbar { padding: 0.5rem; }
      .navbar-brand { font-size: 1.3rem; }
      .nav-link { font-size: 0.8rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link" id="authLink" href="/Auth.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Profile Section -->
  <div class="container">
    <h1>Your Profile</h1>
    <div class="row">
      <div class="col-md-6">
        <div class="card text-white">
          <h5>User Info</h5>
          <p id="userInfo">Loading...</p>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
          <button class="btn btn-outline-light mt-2" onclick="logout()">Logout</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card text-white">
          <h5>Booking History</h5>
          <div id="bookingHistory">Loading...</div>
          <button class="btn btn-outline-light mt-2" onclick="viewAllTrips()">View All Trips</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card text-white">
          <h5>Saved Places</h5>
          <div id="savedPlaces">No saved places yet.</div>
          <button class="btn btn-outline-light mt-2" onclick="viewSavedPlaces()">View All Places</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card text-white">
          <h5>Trekking History</h5>
          <div id="trekkingHistory">No treks recorded.</div>
          <button class="btn btn-outline-light mt-2" onclick="viewTrekkingHistory()">View All Treks</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card text-white">
          <h5>Event Bookings</h5>
          <div id="eventBookings">No event bookings found.</div>
          <button class="btn btn-outline-light mt-2" onclick="viewEventBookings()">View All Events</button>
        </div>
      </div>
    </div>
    <p class="error-message" id="errorMessage"></p>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="editName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="editName" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label for="editPhone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="editPhone" placeholder="Enter your phone number">
          </div>
          <p class="error-message" id="editError"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/assets/js/services/auth.js"></script>
  <script type="module" src="/assets/js/services/firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onAuthStateChange, signOutUser } from '/assets/js/services/auth.js';
    import { getUserProfile, getUserBookings, updateUserProfile } from '/assets/js/services/firestore.js';

    // Check auth state and redirect if not logged in
    onAuthStateChange(async (user) => {
      const authLink = document.getElementById('authLink');
      const errorElement = document.getElementById('errorMessage');
      if (user) {
        authLink.textContent = 'Logout';
        authLink.href = '#';
        authLink.onclick = logout;
        try {
          // Fetch and display user profile
          const profile = await getUserProfile(user.uid);
          if (profile) {
            document.getElementById('userInfo').innerHTML = `
              Name: ${profile.name}<br>
              Email: ${profile.email}<br>
              Phone: ${profile.phone || 'Not provided'}
            `;
            // Pre-fill modal fields
            document.getElementById('editName').value = profile.name;
            document.getElementById('editPhone').value = profile.phone || '';
          } else {
            document.getElementById('userInfo').textContent = 'Profile not found.';
          }
          // Fetch and display booking history
          const bookings = await getUserBookings(user.uid);
          const bookingHistory = document.getElementById('bookingHistory');
          if (bookings.length > 0) {
            bookingHistory.innerHTML = bookings.map(booking => `
              <p>Trip: ${booking.route || 'Unknown'}<br>Date: ${new Date(booking.created_at).toLocaleDateString()}</p>
            `).join('');
          } else {
            bookingHistory.textContent = 'No bookings found.';
          }
          // Placeholder for future data (Saved Places, Trekking History, Event Bookings)
          // These can be implemented with Firestore collections like arka/users/{uid}/saved_places
        } catch (error) {
          errorElement.textContent = error.message;
        }
      } else {
        authLink.textContent = 'Login';
        authLink.href = '/Auth.html';
        authLink.onclick = null;
        window.location.href = '/Auth.html';
      }
    });

    async function logout() {
      try {
        await signOutUser();
        window.location.href = '/index.html';
      } catch (error) {
        document.getElementById('errorMessage').textContent = error.message;
      }
    }

    async function saveProfile() {
      const name = document.getElementById('editName').value;
      const phone = document.getElementById('editPhone').value;
      const errorElement = document.getElementById('editError');
      try {
        const user = await new Promise((resolve) => onAuthStateChange(resolve));
        await updateUserProfile(user.uid, { name, phone });
        document.getElementById('userInfo').innerHTML = `
          Name: ${name}<br>
          Email: ${user.email}<br>
          Phone: ${phone || 'Not provided'}
        `;
        bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
      } catch (error) {
        errorElement.textContent = error.message;
      }
    }

    function viewAllTrips() {
      alert('View All Trips functionality coming soon!');
    }

    function viewSavedPlaces() {
      alert('View Saved Places functionality coming soon!');
    }

    function viewTrekkingHistory() {
      alert('View Trekking History functionality coming soon!');
    }

    function viewEventBookings() {
      alert('View Event Bookings functionality coming soon!');
    }
  </script>
</body>
</html>
