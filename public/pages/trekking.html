<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arka - Trekking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #1a1a3d; color: white; }
    .navbar { background: rgba(0, 0, 0, 0.6); }
    .navbar-brand { font-size: 1.8rem; font-weight: bold; color: #00aaff !important; }
    .nav-link { color: white !important; }
    .nav-link:hover { color: #00aaff !important; }
    .card { background: rgba(255, 255, 255, 0.1); border: none; }
    .btn { transition: transform 0.3s ease; }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">Arka</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/pages/bus-tracking.html">Bus Tracking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/booking.html">Book Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/tourism.html">Tourism</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/trekking.html">Trekking</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Trekking Adventures</h1>
    <div class="row" id="trekking-container">
      <!-- Dynamic trekking route cards will be inserted here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fetch trekking routes data from data.json and render trekking cards
    fetch('../assets/json/data.json')
      .then(response => response.json())
      .then(data => {
        const trekkingRoutes = data.trekking_routes;
        const trekkingContainer = document.getElementById('trekking-container');

        for (const trekId in trekkingRoutes) {
          if (trekkingRoutes.hasOwnProperty(trekId)) {
            const trek = trekkingRoutes[trekId];

            const colDiv = document.createElement('div');
            colDiv.className = 'col-md-4 mb-4';

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card text-white p-3 h-100 d-flex flex-column justify-content-between';

            const title = document.createElement('h5');
            title.textContent = trek.name;
            cardDiv.appendChild(title);

            const details = document.createElement('p');
            details.textContent = `District: ${trek.district} | Difficulty: ${trek.difficulty} | Distance: ${trek.distance_km} km`;
            cardDiv.appendChild(details);

            const weather = document.createElement('p');
            weather.textContent = `Weather Advice: ${trek.weather_advice}`;
            cardDiv.appendChild(weather);

            const button = document.createElement('button');
            button.className = 'btn btn-primary mt-auto';
            button.textContent = 'View Trail Map';
            cardDiv.appendChild(button);

            colDiv.appendChild(cardDiv);
            trekkingContainer.appendChild(colDiv);
          }
        }
      })
      .catch(error => {
        console.error('Error loading trekking data:', error);
      });
  </script>
</body>
</html>
